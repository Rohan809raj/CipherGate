name: CipherGate CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Verify Compact Circuits & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Verify TypeScript Typechecking
        run: npx tsc --noEmit

      - name: Execute Vitest Unit, Circuit & Privacy Tests
        run: npm test

      - name: Build Frontend Production Bundle
        run: npm run build:frontend

      - name: CI Health Check
        run: echo "CipherGate CI pipeline verified successfully with all passing tests."
